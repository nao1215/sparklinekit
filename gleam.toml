name = "sparklinekit"
version = "0.6.0"
description = "Sparklines for Gleam: Unicode blocks for a terminal, and line or bar charts as SVG text or PNG bytes."
licences = ["MIT"]
repository = { type = "github", user = "nao1215", repo = "sparklinekit" }
links = [
  { title = "Repository", href = "https://github.com/nao1215/sparklinekit" },
  { title = "Changelog", href = "https://github.com/nao1215/sparklinekit/blob/main/CHANGELOG.md" },
]
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
birdie = ">= 2.0.0 and < 3.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.14.0 and < 3.0.0"
metamon = ">= 0.13.0 and < 1.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"

[tools.glinter]
warnings_as_errors = true
include = ["src/", "test/"]

[tools.glinter.rules]
label_possible = "off"
prefer_guard_clause = "off"
short_variable_name = "off"
unused_exports = "off"
# `Error(_) -> fallback` is how the renderers read an optional colour or a
# missing pixel; there is no error to pass on.
thrown_away_error = "off"

[tools.glinter.ignore]
"test/**/*.gleam" = [
  "assert_ok_pattern",
  "missing_type_annotation",
  "short_variable_name",
  "unused_exports",
]
